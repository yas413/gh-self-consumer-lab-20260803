name: GH-R60 caller nested outer collision
description: Caller collision; must not resolve

outputs:
  marker:
    description: Caller collision marker
    value: ${{ steps.marker.outputs.value }}

runs:
  using: composite
  steps:
    - id: marker
      shell: bash
      run: printf '%s\n' 'value=CALLER_NESTED_OUTER_COLLISION' >> "$GITHUB_OUTPUT"
